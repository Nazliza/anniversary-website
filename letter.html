
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For You 🤍</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080D24;
            color: #E8E1D8;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            padding: 22px 7%;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            color: #E8E1D8;
            text-decoration: none;
        }

        .music-button {
            background: transparent;
            color: #E8E1D8;
            border: 1px solid #587D99;
            border-radius: 30px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .letter-page {
            min-height: 82vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background:
                radial-gradient(circle at center, #202943, #080D24 75%);
        }

        .letter-heading {
            text-align: center;
            margin-bottom: 45px;
        }

        .letter-heading p {
            color: #B49A82;
            letter-spacing: 4px;
            font-size: 11px;
            margin-bottom: 15px;
        }

        .letter-heading h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 5vw, 48px);
            font-weight: normal;
        }

        .envelope-area {
            text-align: center;
        }

        .envelope {
            width: 230px;
            height: 155px;
            background: #B49A82;
            position: relative;
            cursor: pointer;
            margin: 0 auto 30px;
            border-radius: 5px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.35);
            transition: transform 0.5s;
        }

        .envelope:hover {
            transform: translateY(-8px);
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-left: 115px solid transparent;
            border-right: 115px solid transparent;
            border-top: 90px solid #D0B69E;
            transform-origin: top;
            transition: transform 0.8s;
            z-index: 3;
        }

        .envelope::after {
            content: "♡";
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 35px;
            color: #352820;
            z-index: 4;
        }

        .envelope.open::before {
            transform: rotateX(180deg);
        }

        .envelope.open {
            opacity: 0;
            transform: translateY(40px);
            pointer-events: none;
            transition: 0.8s;
        }

        .envelope-instruction {
            color: #B49A82;
            font-size: 14px;
        }

        .open-button {
            margin-top: 20px;
            padding: 13px 30px;
            border: none;
            border-radius: 30px;
            background: #587D99;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .open-button:hover {
            background: #B49A82;
        }

        .letter-paper {
            display: none;
            width: min(700px, 95%);
            background: #E8E1D8;
            color: #352820;
            padding: clamp(25px, 6vw, 55px);
            border-radius: 5px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            line-height: 2;
            animation: appear 1s ease forwards;
        }

        .letter-paper.show {
            display: block;
        }

        .letter-paper h2 {
            font-family: 'Playfair Display', serif;
            font-weight: normal;
            font-size: 30px;
            text-align: center;
            margin-bottom: 25px;
        }

        .letter-content {
            white-space: pre-line;
            font-size: 14px;
            min-height: 150px;
        }

        .letter-signature {
            text-align: right;
            margin-top: 30px;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
        }

        .next-button {
            display: inline-block;
            margin-top: 35px;
            text-decoration: none;
            color: white;
            background: #587D99;
            padding: 13px 28px;
            border-radius: 30px;
        }

        .next-button:hover {
            background: #B49A82;
        }

        .footer {
            text-align: center;
            padding: 25px;
            font-size: 12px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media(max-width: 600px) {
            .envelope {
                width: 200px;
                height: 135px;
            }

            .envelope::before {
                border-left-width: 100px;
                border-right-width: 100px;
                border-top-width: 75px;
            }

            .envelope::after {
                top: 55px;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <div class="nav-container">
        <a href="index.html" class="logo">our little story.</a>
        <button id="musicButton" class="music-button">♫ Music</button>
    </div>
</header>

<main class="letter-page">

    <div class="letter-heading">
        <p>A LITTLE SOMETHING FOR YOU</p>
        <h1>A Letter For You ♡</h1>
    </div>

    <div class="envelope-area" id="envelopeArea">
        <div class="envelope" id="envelope"></div>

        <p class="envelope-instruction">
            There's something special inside...
        </p>

        <button class="open-button" id="openLetter">
            Open Your Letter ♡
        </button>
    </div>

    <article class="letter-paper" id="letterPaper">

        <h2>Happy 3rd Anniversary 🤍</h2>

        <div class="letter-content" id="letterContent"></div>

        <div class="letter-signature" id="letterSignature" style="display:none;">
            With love,<br>
            Lisa ♡
        </div>

    </article>

    <a href="index.html" class="next-button" id="backButton" style="display:none;">
        Back to Home ♡
    </a>

</main>

<footer class="footer">
    Made with love, just for us ♡
</footer>

<audio id="backgroundMusic" loop>
    <source src="music/song.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>

<script>
    const openButton = document.getElementById("openLetter");
    const envelope = document.getElementById("envelope");
    const envelopeArea = document.getElementById("envelopeArea");
    const letterPaper = document.getElementById("letterPaper");
    const letterContent = document.getElementById("letterContent");
    const letterSignature = document.getElementById("letterSignature");
    const backButton = document.getElementById("backButton");

    const message = `HAIII SAYANGKUUUUU!

HAPPY ANNIVERSARY KE 3 TAHUNNN YAAA 🤍

Semogaa untukk kedepannnyaa kita bisaa teruss sama sama sampaiii sesuaii keinginan kitaa yaa, yaituu sampai menua...

Meskipun perjalanan kita banyak bangettt rintangannnya, masalahnya, tapii kita tetep selaluuu pilih untukk kembalii bersama sama lagii.

Terimakasihh yaa sayangkuu bocilnaa Lisaaa yang selaluu mengusahakan apapunn untukk Lisa, padahall kann Lisa ribet yaa tapii sayanggg tetepp mauu bertahannn.

Lisa mauu ngucapin banyak banyakkk banyakkkkkk terimakasihh untukk sayanggg yang selaluu ada disampingg akuu, dampinginn aku, ngingetinn aku.. terimakasihhh banyakk yaaa sayangkuuu.

Tapii Lisa jugaa mauu minta maaf yaa, Lisa kadangg nyebelinn, suka tibaa-tibaa cuekk, ubah ubah mood, mestii itu bikinn sayangkuu bingungg dan frustasi yaa... Lisa minta maaff yaaa sayanggg.

Lisa mauu ngucapinn kalo Lisa sayangg bangettt bangetttt bangettttt samaa bocillll!

Tetepp jadii bocilnaa Lisa yaa jangan pernahh berubahh, Lisa selalu takutt kalo bocil tiba tiba berubahh.

I LOVE U MORE BABYY 🤍`;

    let typingStarted = false;

    openButton.addEventListener("click", function () {

        envelope.classList.add("open");

        setTimeout(function () {
            envelopeArea.style.display = "none";
            letterPaper.classList.add("show");

            if (!typingStarted) {
                typingStarted = true;
                let index = 0;

                function typeLetter() {
                    if (index < message.length) {
                        letterContent.textContent += message.charAt(index);
                        index++;
                        letterContent.scrollIntoView({
                            block: "nearest",
                            behavior: "smooth"
                        });
                        setTimeout(typeLetter, 28);
                    } else {
                        letterSignature.style.display = "block";
                        backButton.style.display = "inline-block";
                    }
                }

                typeLetter();
            }
        }, 700);
    });
</script>

</body>
</html>
